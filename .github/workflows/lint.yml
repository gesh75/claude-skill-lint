name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # setup-python has no 3.8 builds for Ubuntu 26.04 (ubuntu-latest).
          - python-version: "3.8"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 test_skill_lint.py
      - name: Self-lint clean fixtures
        run: python3 skill_lint.py tests/fixtures/clean --quiet
      - name: Lint NetOps pack
        run: python3 skill_lint.py skills/netops --quiet
